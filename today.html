<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 바다 소식</title>
<style>
  /* 운전 개요 아래 넓은 띠: 왼쪽 조과 갤러리 · 오른쪽 오늘의 코스와 대회 · 아래 지역 행사 카드 */
  :root { --bg:#15191E; --panel:#1E242B; --panel2:#242B33; --line:#343C45; --fg:#E6EAEE; --muted:#9AA5B1; --dim:#6E7A86;
          --accent:#8CC8F2; --ok:#6FD3A4; --warn:#F5C46B; --bad:#FF8A8D; --sea:#4FA9C9; --buoy:#FF8A5B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
  .wrap { padding: 12px 14px 20px; display: grid; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; } header .date { color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #2A3139; color: var(--fg); border-radius: 999px; padding: 3px 11px; font: 600 12px inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { background: #2E5F86; border-color: #3A6F96; }
  .chip.tag { cursor: default; padding: 1px 8px; font-size: 11px; background: #11151A; }
  .src { margin-left: auto; color: var(--dim); font-size: 11.5px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; }
  .card { background: var(--panel); border: 1px solid #2C343D; border-radius: 8px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .card h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card h2 b { color: var(--fg); font-size: 14px; }
  .notice { background: #2A2412; border: 1px solid #5A4A1E; color: var(--warn); border-radius: 6px; padding: 6px 9px; font-size: 12px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .shot { border-radius: 8px; overflow: hidden; background: #11151A; border: 1px solid #2C343D; display: grid; }
  .shot .pic { position: relative; aspect-ratio: 4 / 3; max-width: 100%; }
  .shot .pic svg { width: 100%; height: 100%; display: block; }
  .shot .badge { position: absolute; left: 6px; top: 6px; background: #000A; color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .shot .sample { position: absolute; right: 6px; top: 6px; background: var(--warn); color: #2A2412; border-radius: 4px; padding: 1px 6px; font: 700 11px inherit; }
  .shot .meta { padding: 7px 9px; display: grid; gap: 2px; }
  .shot .meta b { font-size: 14px; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .pick { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: start; background: #11151A; border-radius: 8px; padding: 8px; }
  .pick img { width: 92px; height: 70px; object-fit: cover; border-radius: 6px; background: var(--panel2); }
  .pick b { font-size: 13.5px; } .pick .score { font: 700 12px Consolas, monospace; padding: 0 6px; border-radius: 4px; }
  .양호 { color: var(--ok); background: #6FD3A41F; } .보통 { color: var(--warn); background: #F5C46B1F; } .주의 { color: var(--bad); background: #FF8A8D1F; }
  .empty { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; color: var(--muted); display: grid; gap: 6px; }
  .empty button, .btn { justify-self: start; min-height: 28px; border-radius: 5px; border: 1px solid #3E4852; background: #2A3139; color: var(--fg); font: inherit; padding: 0 10px; cursor: pointer; }
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .ev { background: var(--panel); border: 1px solid #2C343D; border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; cursor: pointer; text-decoration: none; color: inherit; }
  .ev:hover, .ev:focus-visible { border-color: #3A6F96; outline: none; }
  .ev .img { position: relative; aspect-ratio: 16 / 9; background: var(--panel2); }
  .ev img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ev .when { position: absolute; left: 6px; bottom: 6px; background: #000B; color: #fff; border-radius: 4px; padding: 1px 7px; font-size: 11.5px; }
  .ev .now { position: absolute; right: 6px; top: 6px; background: var(--ok); color: #0E2A1D; border-radius: 4px; padding: 1px 6px; font: 700 11px inherit; }
  .ev .body { padding: 9px 10px; display: grid; gap: 5px; align-content: start; }
  .ev .body b { font-size: 13.5px; }
  .near { font-size: 12px; } .near .score { font: 700 11.5px Consolas, monospace; padding: 0 5px; border-radius: 4px; }
  .foot { color: var(--dim); font-size: 11px; line-height: 1.6; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌅 오늘의 바다 소식</h1><span class="date" id="date"></span>
    <div class="chips" id="seaChips"></div>
    <div class="chips" id="tagChips"></div>
    <span class="src" id="src"></span>
  </header>

  <div class="grid">
    <section class="card" aria-labelledby="hCatch">
      <h2 id="hCatch"><b>🎣 오늘의 조과</b><span id="catchSub"></span></h2>
      <div id="catchNote"></div>
      <div class="gallery" id="gallery"></div>
    </section>
    <div style="display:grid;gap:12px;align-content:start;min-width:0">
      <section class="card" aria-labelledby="hPick">
        <h2 id="hPick"><b>🧭 오늘의 추천 코스</b><span>출조 + 지역 탐방</span></h2>
        <div id="picks" style="display:grid;gap:8px"></div>
      </section>
      <section class="card" aria-labelledby="hTour">
        <h2 id="hTour"><b>🏆 선상·낚시 대회</b><span>지역 홍보</span></h2>
        <div id="tours"></div>
      </section>
    </div>
  </div>

  <section class="card" aria-labelledby="hEv">
    <h2 id="hEv"><b>🎪 이번 주 지역 행사</b><span>가까운 항구와 출조 지수를 함께 · 가족·교육·힐링</span></h2>
    <div class="events" id="events"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<script src="today-data.js"></script>
<script>
'use strict';
const post = m => { try { window.chrome.webview.postMessage(m); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D = window.TODAY_DATA || { catches: [], events: [], picks: [], tournaments: [], scores: {} };

// 연안 시군(PC Catalog·모바일과 같은 좌표) — 행사에서 가장 가까운 항구와 출조 지수를 찾을 때 씁니다
const PORTS = [['인천',37.45,126.60],['강화',37.70,126.45],['안산',37.25,126.58],['화성',37.19,126.65],['평택',36.97,126.83],['당진',37.00,126.62],['서산',36.95,126.40],['태안',36.75,126.15],
  ['보령',36.35,126.52],['서천',36.08,126.62],['군산',35.94,126.53],['부안',35.65,126.50],['영광',35.37,126.40],['함평',35.10,126.45],['무안',34.95,126.35],['목포',34.79,126.38],['신안',34.80,126.10],
  ['해남',34.55,126.55],['진도',34.43,126.25],['완도',34.31,126.75],['고흥',34.52,127.14],['여수',34.73,127.72],['남해',34.80,127.95],['사천',34.93,128.07],['통영',34.83,128.43],['거제',34.88,128.62],
  ['창원',35.15,128.58],['부산',35.10,129.04],['기장',35.24,129.23],['울산',35.50,129.38],['경주',35.80,129.48],['포항',36.03,129.38],['영덕',36.40,129.40],['울진',36.75,129.45],['삼척',37.43,129.18],
  ['동해',37.52,129.12],['강릉',37.77,128.95],['속초',38.20,128.60],['제주시',33.52,126.53],['서귀포',33.24,126.56]];
const WEST = ['인천','강화','안산','화성','평택','당진','서산','태안','보령','서천','군산','부안','영광','함평','무안','목포','신안'], EAST = ['울산','경주','포항','영덕','울진','삼척','동해','강릉','속초'];
const seaOf = n => WEST.includes(n) ? '서해' : EAST.includes(n) ? '동해' : ['제주시','서귀포'].includes(n) ? '제주' : '남해';
const km = (a, b, c, d) => { const r = Math.PI / 180, h = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
const nearest = (lat, lon) => PORTS.map(p => ({ name: p[0], km: km(lat, lon, p[1], p[2]) })).sort((a, b) => a.km - b.km)[0];
// 점수가 있는 감시 지역 중 가장 가까운 곳(행사 → 출조 연결)
const nearestScored = (lat, lon) => Object.keys(D.scores).map(n => { const p = PORTS.find(x => x[0] === n); return p && { name: n, km: km(lat, lon, p[1], p[2]), s: D.scores[n] }; }).filter(Boolean).sort((a, b) => a.km - b.km)[0];

const FISH = { 갑오징어: '#B05CC4', 쭈꾸미: '#E3A21A', 참돔: '#E2572B', 무늬오징어: '#6C5FD0', 우럭: '#3C7FC0', 방어: '#4A90A8', 광어: '#1D8A5B', 갈치: '#AEB9BF', 문어: '#C97A2F' };
// 사진이 없을 때 쓰는 그림 카드(예시 데이터 표시용) — 실제 운영에서는 사용자·선장이 올린 사진으로 바뀝니다
function fishArt(sp, i) {
  const c = FISH[sp] || '#4FA9C9', squid = /오징어|쭈꾸미|문어/.test(sp), g = 'g' + i;
  const body = squid
    ? `<ellipse cx="0" cy="-8" rx="17" ry="27" fill="${c}"/><path d="M-14 14 q-6 26 -2 34 M-7 16 q-3 28 0 36 M0 16 q0 30 0 38 M7 16 q3 28 0 36 M14 14 q6 26 2 34" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-6" cy="4" r="3" fill="#fff"/><circle cx="6" cy="4" r="3" fill="#fff"/>`
    : `<path d="M-46 0 Q-10 -26 30 0 Q-10 26 -46 0Z" fill="${c}"/><path d="M28 0 L50 -16 L46 0 L50 16Z" fill="${c}"/><circle cx="-30" cy="-4" r="3.5" fill="#fff"/><circle cx="-30" cy="-4" r="1.6" fill="#111"/><path d="M-6 -18 q10 -12 22 -2" stroke="${c}" stroke-width="5" fill="none"/>`;
  return `<svg viewBox="0 0 160 120" role="img" aria-label="${esc(sp)} 그림"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D4E63"/><stop offset="1" stop-color="#0D2430"/></linearGradient></defs>
    <rect width="160" height="120" fill="url(#${g})"/><path d="M0 92 q20 -8 40 0 t40 0 t40 0 t40 0 V120 H0Z" fill="#0A1C26"/>
    <g transform="translate(80 ${squid ? 50 : 58}) rotate(${squid ? 0 : -8})">${body}</g></svg>`;
}

const state = { sea: '전체', tag: '전체' };
const inSea = region => state.sea === '전체' || seaOf(region) === state.sea;
const dshort = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
const dow = s => '일월화수목금토'[new Date(s + 'T12:00:00').getDay()];

function render() {
  const today = D.date;
  $('date').textContent = `${today.slice(0, 4)}년 ${dshort(today)}(${dow(today)})`;
  $('src').textContent = `수집 ${D.collectedAt} · 출조 지수는 ${dshort(D.scoreDay)}(${dow(D.scoreDay)}) 예보`;
  $('seaChips').innerHTML = ['전체', '서해', '남해', '동해', '제주'].map(s => `<button class="chip" data-sea="${s}" aria-pressed="${state.sea === s}">${s}</button>`).join('');
  $('tagChips').innerHTML = ['전체', '가족', '교육', '힐링', '먹거리', '바다'].map(s => `<button class="chip" data-tag="${s}" aria-pressed="${state.tag === s}">${s === '전체' ? '모든 행사' : '#' + s}</button>`).join('');

  // 조과: 오늘 → 없으면 이번 주
  const all = D.catches.filter(c => inSea(c.region));
  const todays = all.filter(c => c.day === today), list = todays.length ? todays : all;
  $('catchSub').textContent = todays.length ? `오늘 ${todays.length}건` : `이번 주 ${list.length}건`;
  $('catchNote').innerHTML = (todays.length ? '' : '<div class="notice">오늘 올라온 조과가 아직 없어 최근 7일 조과를 보여 줍니다.</div>') +
    (list.some(c => c.sample) ? '<div class="dim" style="font-size:11.5px">‘예시’ 카드는 화면 구성을 보여 주는 견본입니다. 휴대폰 수첩·조황 수첩·선장 등록 사진이 들어오면 실제 사진으로 바뀝니다.</div>' : '');
  $('gallery').innerHTML = list.length ? list.map((c, i) => `<div class="shot"><div class="pic">${c.photo ? `<img src="${esc(c.photo)}" alt="${esc(c.sp)} 조과 사진" style="width:100%;height:100%;object-fit:cover">` : fishArt(c.sp, i)}
      <span class="badge">${esc(c.source)}</span>${c.sample ? '<span class="sample">예시</span>' : ''}</div>
      <div class="meta"><b>${esc(c.sp)} <span style="font-weight:400;font-size:12px">${esc(c.size)}</span></b>
      <span>${esc(c.count)}</span><span class="muted">${dshort(c.day)}(${dow(c.day)}) · ${esc(c.region)} ${esc(c.port)}${c.boat ? ' · ' + esc(c.boat) : ''}</span></div></div>`).join('')
    : '<div class="empty">이 바다에는 이번 주 조과 기록이 없습니다.</div>';

  // 추천 코스
  $('picks').innerHTML = D.picks.filter(p => inSea(p.region)).map(p => { const ev = D.events.find(e => e.id === p.event) || {}, s = D.scores[p.region];
    return `<div class="pick">${ev.img ? `<img src="${esc(ev.img)}" alt="${esc(ev.title)}" loading="lazy">` : '<div></div>'}<div style="display:grid;gap:3px;min-width:0">
      <b>${esc(p.title)}</b><span>${s ? `<span class="score ${s[1]}">${esc(p.region)} ${s[0]} ${s[1]}</span>` : ''} <span class="dim">${esc(ev.title || '')}</span></span>
      <span class="muted" style="font-size:12px">${esc(p.why)}</span></div></div>`; }).join('') || '<div class="empty">이 바다의 추천 코스가 없습니다.</div>';

  // 대회
  $('tours').innerHTML = D.tournaments.length ? D.tournaments.filter(t => inSea(t.region)).map(t => `<div class="pick">${t.img ? `<img src="${esc(t.img)}" alt="">` : '<div></div>'}<div><b>${esc(t.title)}</b><div class="muted">${esc(t.when)} · ${esc(t.where)}</div><div class="dim">${esc(t.note || '')}</div></div></div>`).join('')
    : `<div class="empty">${esc(D.tournamentNote)}<button class="btn" id="regTour">＋ 대회·이벤트 등록하기</button></div>`;
  if ($('regTour')) $('regTour').onclick = () => post({ type: 'today-register', kind: 'tournament' });

  // 지역 행사
  const evs = D.events.filter(e => { const n = nearest(e.lat, e.lon); return (state.sea === '전체' || seaOf(n.name) === state.sea) && (state.tag === '전체' || e.tags.includes(state.tag)); })
    .sort((a, b) => (a.upcoming ? 1 : 0) - (b.upcoming ? 1 : 0) || a.end.localeCompare(b.end));
  $('events').innerHTML = evs.map(e => { const n = nearest(e.lat, e.lon), s = nearestScored(e.lat, e.lon), live = e.start <= today && e.end >= today;
    const yearRound = e.start.slice(5) === '01-01' && e.end.slice(5) === '12-31';
    const when = yearRound ? '연중' : e.start === e.end ? `${dshort(e.start)}(${dow(e.start)})` : `${dshort(e.start)}~${dshort(e.end)}`;
    return `<a class="ev" href="https://korean.visitkorea.or.kr/search/search_list.do?keyword=${encodeURIComponent(e.title)}" target="_blank" rel="noopener" data-title="${esc(e.title)}">
      <div class="img"><img src="${esc(e.img)}" alt="${esc(e.title)}" loading="lazy"><span class="when">${when}</span>${live ? '<span class="now">진행 중</span>' : e.upcoming ? '<span class="now" style="background:var(--accent);color:#0D2433">예정</span>' : ''}</div>
      <div class="body"><b>${esc(e.title)}</b><span class="muted" style="font-size:12px">${esc(e.addr)}</span>
      <div class="chips">${e.tags.map(t => `<span class="chip tag">#${t}</span>`).join('')}</div>
      <span class="near">⚓ ${esc(n.name)}에서 ${n.km.toFixed(0)}km${s && s.km < 60 ? ` · <span class="score ${s.s[1]}">${esc(s.name)} 지수 ${s.s[0]}</span>` : ''}</span></div></a>`; }).join('') || '<div class="empty">조건에 맞는 행사가 없습니다.</div>';
  document.querySelectorAll('.ev').forEach(a => a.addEventListener('click', ev => { if (window.chrome && window.chrome.webview) { ev.preventDefault(); post({ type: 'open', url: a.href }); } }));

  $('foot').innerHTML = '행사 정보·사진: 한국관광공사 TourAPI(공공누리) · 출조 지수: Open-Meteo(풍속·파고·비, PC·모바일과 같은 공식) · 조과: 휴대폰 수첩·바다 조황 수첩·선장 등록 · 일정은 바뀔 수 있으니 방문 전 주최 측에 확인하세요.';
  document.querySelectorAll('[data-sea]').forEach(b => b.onclick = () => { state.sea = b.dataset.sea; render(); });
  document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { state.tag = b.dataset.tag; render(); });
}
render();
</script>
</body>
</html>

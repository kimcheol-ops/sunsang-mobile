<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>낚시점 · 선상 정보</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; background: #15191E; color: #E6EAEE; font: 13.5px/1.5 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; color-scheme: dark; }
  #app { padding: 10px max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1E242B; color: #E6EAEE; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="places-data.js"></script>
<script src="places.js"></script>
<script>
  // PC 탭·휴대폰 앱: 이 기기 저장 + 매일 반영되는 공유 집계(places-data.js의 community)
  const inPC = !!(window.chrome && window.chrome.webview);
  window.placesApi = PlacesApp.mount(document.getElementById('app'), { data: window.PLACES_DATA, store: PlacesApp.localStore(window.PLACES_DATA.community), map: true, inPC });
  try { window.chrome.webview.postMessage({ type: 'ready' }); } catch (e) {}
</script>
</body>
</html>
